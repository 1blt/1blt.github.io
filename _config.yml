# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank
first_name: Alan
middle_name:
last_name: Wang, Ph.D.
contact_note: >
  Add me on linkedin or send me an email!
description: >
  Creative Technologist. Building things at the intersection of data science, design, and automation.
keywords: creative technologist, data science, design, automation, portfolio
lang: en
icon: favicon.ico
url: https://1blt.github.io/
baseurl:
last_updated: false
back_to_top: false

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: false
footer_fixed: false
search_enabled: false
max_width: 900px

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------

google_analytics: G-8K53Q9C277

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - readme_preview/
  - vendor
  - _books/
  - _news/
  - _posts_ex/

keep_files:
  - CNAME
  - .nojekyll

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll/scholar

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Wang]
  first_name: [Alan, A.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

  # Disable bibtex filters to avoid plugin dependencies
  bibtex_filters: []

# Filter bibtex keywords from output
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    google_scholar_id,
    html,
    inspirehep_id,
    pdf,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: false
enable_publication_badges: false

# -----------------------------------------------------------------------------
# Optional Features (mostly disabled for minimal theme)
# -----------------------------------------------------------------------------

enable_google_analytics: false
enable_masonry: false
enable_math: false
enable_tooltips: false
enable_darkmode: false
enable_navbar_social: false
enable_project_categories: false
enable_medium_zoom: false
enable_progressbar: false
enable_video_embedding: false

# -----------------------------------------------------------------------------
# Responsive Images (disabled for simplicity)
# -----------------------------------------------------------------------------

imagemagick:
  enabled: false

lazy_loading_images: true

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
